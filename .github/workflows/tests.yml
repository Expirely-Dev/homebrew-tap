name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
      - run: brew trust --tap expirely-dev/tap
      - run: brew test-bot --only-tap-syntax

  install:
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - id: brew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
      - name: Install and test each formula
        env:
          TAP_PATH: ${{ steps.brew.outputs.repository-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in "$TAP_PATH"/Formula/*.rb; do
            name="expirely-dev/tap/$(basename "$file" .rb)"
            brew install --formula "$name"
            brew test "$name"
          done
