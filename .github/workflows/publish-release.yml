name: publish-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag of expirely-dev/expirely-cli, such as v0.6.0
        required: true
      reviewer:
        description: GitHub user asked to review the pull request
        required: false

permissions: {}

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      REVIEWER: ${{ inputs.reviewer }}
    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a release tag such as v0.6.0, got $VERSION"
            exit 1
          fi

      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - name: Download the release and verify its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          gh release download "$VERSION" --repo expirely-dev/expirely-cli --dir "$RUNNER_TEMP/release" \
            --pattern checksums.txt \
            --pattern "expirely_${ver}_darwin_*.tar.gz" \
            --pattern "expirely_${ver}_linux_*.tar.gz"
          cd "$RUNNER_TEMP/release"
          for archive in expirely_*.tar.gz; do
            gh attestation verify "$archive" --repo Expirely-Dev/expirely-cli \
              --signer-workflow Expirely-Dev/expirely-cli/.github/workflows/release.yml
          done
          sha256sum --check --ignore-missing --strict checksums.txt

      - name: Render the formula
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          sum() {
            local s
            s="$(awk -v f="expirely_${ver}_$1.tar.gz" '$2 == f { print $1 }' "$RUNNER_TEMP/release/checksums.txt")"
            if [[ ! "$s" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::checksums.txt has no sha256 for expirely_${ver}_$1.tar.gz" >&2
              exit 1
            fi
            echo "$s"
          }
          darwin_arm64="$(sum darwin_arm64)"
          darwin_amd64="$(sum darwin_amd64)"
          linux_arm64="$(sum linux_arm64)"
          linux_amd64="$(sum linux_amd64)"
          sed \
            -e "s/{{VERSION}}/${ver}/g" \
            -e "s/{{SHA256_DARWIN_ARM64}}/${darwin_arm64}/" \
            -e "s/{{SHA256_DARWIN_AMD64}}/${darwin_amd64}/" \
            -e "s/{{SHA256_LINUX_ARM64}}/${linux_arm64}/" \
            -e "s/{{SHA256_LINUX_AMD64}}/${linux_amd64}/" \
            Formula/expirely.rb.tpl > Formula/expirely.rb
          if grep -q '{{' Formula/expirely.rb; then
            echo "::error::Formula/expirely.rb still has a placeholder"
            exit 1
          fi

      - name: Check and install the formula
        run: |
          brew trust --tap expirely-dev/tap
          brew test-bot --only-tap-syntax
          brew install --formula expirely-dev/tap/expirely
          brew test expirely-dev/tap/expirely

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/expirely.rb
          if git diff --cached --quiet; then
            echo "Formula/expirely.rb is already at $VERSION"
            exit 0
          fi
          branch="release/expirely-$VERSION"
          git switch --create "$branch"
          git commit --message "expirely $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "expirely $VERSION" \
            --body "Updates the expirely formula to [$VERSION](https://github.com/expirely-dev/expirely-cli/releases/tag/$VERSION). Every archive passed \`gh attestation verify\` against the expirely-cli release workflow, and the formula passed \`brew test-bot --only-tap-syntax\`, \`brew install\` and \`brew test\` on Linux." \
            ${REVIEWER:+--reviewer "$REVIEWER"}
